name: Sync GitFlic to GitHub

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Code and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Clone code gốc vào thư mục tạm NẰM NGOÀI dự án
          git clone https://gitflic.ru/project/neyrostalker/proksi-biblioteka.git ../upstream_repo

          # 2. Chép toàn bộ file vào thư mục dự án của bạn (bảo vệ .github)
          rsync -av --delete --exclude='.git' --exclude='.github' ../upstream_repo/ ./

          # 3. Lấy tên nhánh hiện tại để lát nữa quay về
          CURRENT_BRANCH=$(git branch --show-current)
          if [ -z "$CURRENT_BRANCH" ]; then
            CURRENT_BRANCH="main"
          fi

          # 4. Commit và Push các file gốc lên nhánh hiện tại của dự án
          git add .
          if git diff-index --quiet HEAD; then
            echo "Mã nguồn nhánh chính không có thay đổi nào mới."
          else
            git commit -m "Đồng bộ mã nguồn từ dự án gốc GitFlic"
            git push origin HEAD
          fi

          # 5. Kéo TOÀN BỘ lịch sử Tags từ dự án gốc về và push lên GitHub
          echo "Đồng bộ tất cả các tags..."
          git fetch ../upstream_repo 'refs/tags/*:refs/tags/*'
          git push origin --tags

          # 6. Duyệt qua TẤT CẢ các tags để tạo Release
          for TAG in $(git tag); do
            echo "----------------------------------------"
            echo "Đang kiểm tra Tag: $TAG"
            
            if ! gh release view "$TAG" > /dev/null 2>&1; then
              echo "Phát hiện bản chưa có release. Tiến hành tạo cho $TAG..."
              
              # Tạm thời Checkout về đúng commit của Tag này để chép lịch sử file
              git checkout "$TAG"
              
              # Không dùng file Список изменений.md nữa. Trỏ thẳng link về bản gốc để người dùng xem chính xác nhất.
              echo "Версия $TAG" > release_notes.txt
              echo "" >> release_notes.txt
              echo "Bản cập nhật được đồng bộ tự động từ GitFlic." >> release_notes.txt
              echo "🔗 **[Xem chi tiết thay đổi tại trang phát hành gốc](https://gitflic.ru/project/neyrostalker/proksi-biblioteka/release)**" >> release_notes.txt

              # Khôi phục file đính kèm (.zip)
              ZIP_FILE="Прокси_библиотека_${TAG}.zip"
              if [ -d "Bin" ]; then
                # Nén thư mục Bin và tài liệu y hệt cách tác giả làm
                zip -r "$ZIP_FILE" Bin/ README.md "Список изменений.md" 2>/dev/null || true
              fi

              # Tạo release kèm theo file Zip (nếu nén thành công)
              if [ -f "$ZIP_FILE" ]; then
                gh release create "$TAG" "$ZIP_FILE" \
                  --title "Release $TAG" \
                  --notes-file release_notes.txt
              else
                gh release create "$TAG" \
                  --title "Release $TAG" \
                  --notes-file release_notes.txt
              fi
                
              # Dọn dẹp file tạm
              rm -f "$ZIP_FILE" release_notes.txt
            else
              echo "Release $TAG đã tồn tại, bỏ qua."
            fi
          done
          
          # 7. Cuối cùng, trả repo về lại nhánh gốc để không bị lỗi Detached HEAD
          git checkout "$CURRENT_BRANCH"
