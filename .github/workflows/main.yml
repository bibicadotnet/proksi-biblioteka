name: Sync GitFlic to GitHub

on:
  schedule:
    # 1h chạy 1 lần. timezone: UTC (Giờ VN là UTC+7)
    - cron: '0 * * * *'
  # Cho phép kích hoạt chạy thủ công từ tab Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Source Code and Tags
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Thêm remote upstream về repo GitFlic
          git remote add upstream https://gitflic.ru/project/neyrostalker/proksi-biblioteka.git || true
          
          # Fetch toàn bộ nhánh và tags
          git fetch upstream '+refs/heads/*:refs/remotes/upstream/*' --tags

          # Nhận diện tự động nhánh mặc định (master hoặc main)
          DEFAULT_BRANCH=$(git ls-remote --symref upstream HEAD | awk '/^ref:/ { sub(/refs\/heads\//, "", $2); print $2 }')
          if [ -z "$DEFAULT_BRANCH" ]; then
            DEFAULT_BRANCH="master"
          fi

          # Reset hoàn toàn repo hiện tại cho bằng với GitFlic
          git checkout -B $DEFAULT_BRANCH upstream/$DEFAULT_BRANCH

          # Push đè mã nguồn và tags lên GitHub
          git push origin $DEFAULT_BRANCH --force
          git push origin --tags --force

      - name: Sync Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lấy tag mới nhất vừa được đồng bộ về
          LATEST_TAG=$(git describe --tags --abbrev=0 || echo "")

          if [ -n "$LATEST_TAG" ]; then
            echo "Tag mới nhất: $LATEST_TAG"

            # Kiểm tra xem tag này đã được tạo thành Release trên GitHub chưa
            if ! gh release view "$LATEST_TAG" > /dev/null 2>&1; then
              echo "Chưa có release cho $LATEST_TAG. Bắt đầu tạo mới..."

              # LƯU Ý: Nếu bản release trên GitFlic có đính kèm file nén (.zip, tar.gz) hoặc file chạy,
              # bạn sẽ cần trích xuất link tải trực tiếp và sử dụng wget/curl tải về tại đây trước khi tạo release.
              # Ví dụ: 
              # curl -sSL -o release_assets.zip "https://gitflic.ru/project/neyrostalker/proksi-biblioteka/release/..."
              #
              # Nếu có file tải về, hãy nối thêm tên file (vd: release_assets.zip) vào sau lệnh gh release create

              gh release create "$LATEST_TAG" \
                --title "Release $LATEST_TAG" \
                --notes "Bản cập nhật đồng bộ tự động từ GitFlic: https://gitflic.ru/project/neyrostalker/proksi-biblioteka/release"
            else
              echo "Release $LATEST_TAG đã tồn tại trên dự án, bỏ qua bước tạo."
            fi
          else
            echo "Dự án hiện tại không có tag nào."
          fi
