name: Sync GitFlic to GitHub

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync Code and Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 1. Clone code gốc vào thư mục tạm NẰM NGOÀI dự án
          git clone https://gitflic.ru/project/neyrostalker/proksi-biblioteka.git ../upstream_repo

          # 2. Chép toàn bộ file vào thư mục dự án của bạn (bảo vệ .github)
          rsync -av --delete --exclude='.git' --exclude='.github' ../upstream_repo/ ./

          # 3. Commit và Push các file gốc lên nhánh hiện tại của dự án
          git add .
          if git diff-index --quiet HEAD; then
            echo "Mã nguồn nhánh chính không có thay đổi nào mới."
          else
            git commit -m "Đồng bộ mã nguồn từ dự án gốc GitFlic"
            git push origin HEAD
          fi

          # 4. Kéo TOÀN BỘ lịch sử Tags từ dự án gốc về
          echo "Đồng bộ tất cả các tags..."
          git fetch ../upstream_repo 'refs/tags/*:refs/tags/*'
          
          # Đẩy toàn bộ tags lên GitHub
          git push origin --tags

          # 5. Duyệt qua TẤT CẢ các tags để tạo Release kèm Description gốc
          for TAG in $(git tag); do
            echo "----------------------------------------"
            echo "Đang kiểm tra Tag: $TAG"
            
            if ! gh release view "$TAG" > /dev/null 2>&1; then
              echo "Phát hiện bản mới/chưa có release. Tiến hành tạo release cho $TAG..."
              
              # Lấy nội dung ghi chú gốc của Tag (Description) xuất ra file văn bản
              git tag -l --format='%(contents)' "$TAG" > release_notes.txt
              
              # Nếu tag không chứa nội dung (do tác giả GitFlic không đính kèm vào git tag), dùng câu mặc định
              if [ ! -s release_notes.txt ] || [ -z "$(cat release_notes.txt | tr -d '[:space:]')" ]; then
                echo "Bản cập nhật đồng bộ từ GitFlic: https://gitflic.ru/project/neyrostalker/proksi-biblioteka/release" > release_notes.txt
              fi

              # Tạo release sử dụng nội dung từ file vừa trích xuất
              gh release create "$TAG" \
                --title "Release $TAG" \
                --notes-file release_notes.txt
                
              # Xóa file tạm sau khi tạo xong
              rm -f release_notes.txt
            else
              echo "Release $TAG đã tồn tại, bỏ qua."
            fi
          done
